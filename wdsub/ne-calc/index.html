<!DOCTYPE html>
<html>
<head>
  <title>NE</title>
  <link rel="stylesheet" href="ne-calc-styles.css">
</head>
  <body>
<h1>Nash Equilbrium Calculator</h1>
<div id= "directions">
<p>This applet is a two person game in normal form and computes  pure strategy Nash Equilibrium using best response of dominated strategy. </p>
  <p><em>Go</em>Compute<em></em></p>
</div>
 
<div id="input-grp">
<label for="p1-strats">Number of pure Strats for P1</label>
  <input id="p1-strats" type="number" min="1" max="8" value="1">

<br>
<br>
<label for="p2-strats">Number of pure Strats for P2</label>
<input id= "p2-strats" type="number" min="1" max="8" value="1">
  <br>
  <br>
<button onclick="goToMatrix()">Go</button>
  </div>

<script>
  function goToMatrix(){
    let p1Strats= document.getElementById("p1-strats").value;
    let p2Strats= document.getElementById("p2-strats").value;
    navigation.navigate("matrix.html?p1Strats=" + p1Strats + "&p2Strats=" + p2Strats);
  }
</script>   
  </body>
</html>
